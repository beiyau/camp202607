<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生活大冒險｜學員上傳區</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F0EEE9;--bg2:#E4E0D8;--card:#D5D0C8;
  --nav:#3D3B37;--text:#3D3B37;--sub:#8A8880;--hint:#B0A9A0;
  --accent:#7A9470;--accent2:#5C7254;--warm:#B85C38;--gold:#C8B87A;--cream:#FAF8F4;
}
body{background:var(--bg);font-family:"Noto Sans TC",sans-serif;color:var(--text);min-height:100svh}
header{background:var(--nav);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.06)}
.header-center{text-align:center;flex:1}
header h1{font-family:"Zen Kaku Gothic New",sans-serif;font-size:1.2rem;color:var(--gold);font-weight:700;letter-spacing:.06em}
header p{color:rgba(255,255,255,.45);font-size:.75rem;margin-top:3px}
.home-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.75);font-family:"Noto Sans TC",sans-serif;font-size:.78rem;font-weight:700;padding:7px 14px;border-radius:4px;text-decoration:none;white-space:nowrap;transition:background .2s}
.home-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.container{max-width:480px;margin:28px auto;padding:0 20px 60px}
.card{background:var(--cream);border-radius:8px;padding:22px 18px;border:1px solid var(--card);margin-bottom:14px}
label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.18em;color:var(--hint);text-transform:uppercase;margin-bottom:10px}
select,textarea{width:100%;padding:10px 13px;border:1.5px solid var(--card);border-radius:6px;font-family:"Noto Sans TC",sans-serif;font-size:.92rem;outline:none;transition:border .2s;background:#fff;color:var(--text)}
select:focus,textarea:focus{border-color:var(--accent)}
.day-pills{display:flex;gap:6px}
.day-pill{flex:1;padding:9px 0;border:1.5px solid var(--card);border-radius:4px;background:#fff;font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:.82rem;color:var(--hint);cursor:pointer;text-align:center;transition:all .2s}
.day-pill.active{border-color:var(--accent);color:var(--accent);background:var(--cream)}
textarea{min-height:110px;resize:vertical;line-height:1.7}

/* 照片上傳區 */
.photo-upload-zone{
  border:2px dashed var(--card);border-radius:8px;
  padding:28px 20px;text-align:center;cursor:pointer;
  transition:all .2s;background:#fff;position:relative;
  margin-bottom:10px;
}
.photo-upload-zone:hover{border-color:var(--accent);background:var(--bg)}
.photo-upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.puz-icon{font-size:2rem;display:block;margin-bottom:8px}
.puz-text{font-size:.88rem;color:var(--sub);line-height:1.6}
.puz-hint{font-size:.75rem;color:var(--hint);margin-top:4px}
.photo-preview-wrap{display:none;margin-bottom:10px}
.photo-preview-wrap img{width:100%;max-height:280px;object-fit:cover;border-radius:8px;display:block}
.photo-change-btn{display:block;text-align:center;font-size:.78rem;color:var(--accent);margin-top:6px;cursor:pointer;font-weight:700}
.compress-info{font-size:.72rem;color:var(--hint);text-align:center;margin-top:4px}

.submit-btn{width:100%;padding:14px;background:var(--nav);color:var(--gold);border:none;border-radius:6px;font-family:"Zen Kaku Gothic New",sans-serif;font-size:1rem;cursor:pointer;transition:opacity .2s;margin-top:4px;font-weight:700;letter-spacing:.06em}
.submit-btn:hover{opacity:.82}
.submit-btn:disabled{opacity:.4;cursor:not-allowed}
.progress-bar{width:0%;height:4px;background:var(--accent);border-radius:2px;transition:width .3s;margin-top:10px}
.progress-wrap{background:var(--card);border-radius:2px;overflow:hidden;display:none;margin-top:10px}
.msg{text-align:center;padding:12px;border-radius:6px;font-weight:700;margin-top:14px;display:none;font-size:.88rem}
.msg.ok{background:#e8f5e2;color:#3a6b2a;border:1px solid #c2e0b4}
.msg.err{background:#fae8e8;color:#7a2a2a;border:1px solid #e0b4b4}
</style>
</head>
<body>
<header>
  <a class="home-btn" href="index.html">← 返回首頁</a>
  <div class="header-center">
    <h1>🏕️ 生活大冒險 2026</h1>
    <p>學員上傳專區｜貼照片・寫心得</p>
  </div>
  <div style="width:90px"></div>
</header>

<div class="container">
  <div class="card">
    <label>我是誰？</label>
    <select id="sel-name">
      <option value="">— 選擇你的名字 —</option>
      <option value="小恩">🐯 小恩</option>
      <option value="莎莎">🐰 莎莎</option>
      <option value="一樂">🐻 一樂</option>
      <option value="候補">🦊 候補</option>
    </select>
  </div>

  <div class="card">
    <label>這是第幾天的內容？</label>
    <div class="day-pills">
      <button class="day-pill active" data-day="1" onclick="pickDay(this)">第一天</button>
      <button class="day-pill" data-day="2" onclick="pickDay(this)">第二天</button>
      <button class="day-pill" data-day="3" onclick="pickDay(this)">第三天</button>
    </div>
  </div>

  <div class="card">
    <label>📸 今天的照片（選一張）</label>
    <div class="photo-preview-wrap" id="previewWrap">
      <img id="previewImg" src="" alt="預覽">
      <span class="photo-change-btn" onclick="changePhoto()">重新選擇照片</span>
      <div class="compress-info" id="compressInfo"></div>
    </div>
    <div class="photo-upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this)">
      <span class="puz-icon">📷</span>
      <div class="puz-text">點擊選擇照片<br>或直接拖曳到這裡</div>
      <div class="puz-hint">支援 JPG、PNG、HEIC，自動壓縮</div>
    </div>
  </div>

  <div class="card">
    <label>📝 今天的心得</label>
    <textarea id="inp-diary" placeholder="寫下今天學到什麼、最開心的事、最有挑戰的事…"></textarea>
  </div>

  <button class="submit-btn" id="submit-btn" onclick="submitForm()">送出</button>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="msg" id="msg"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLZcMRiGqPf0VjigZKPyTctxl6Gcx16i-FmZPzFaJDKbPyhGiuroklr_XzJvL2RxpR/exec";
let selectedDay = 1;
let compressedBase64 = '';

function pickDay(btn) {
  document.querySelectorAll('.day-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedDay = parseInt(btn.dataset.day);
}

function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  compressImage(file, 800, 0.7, function(base64, sizeKB) {
    compressedBase64 = base64;
    document.getElementById('previewImg').src = base64;
    document.getElementById('previewWrap').style.display = 'block';
    document.getElementById('uploadZone').style.display = 'none';
    document.getElementById('compressInfo').textContent = '圖片大小：約 ' + sizeKB + ' KB';
  });
}

function changePhoto() {
  compressedBase64 = '';
  document.getElementById('previewWrap').style.display = 'none';
  document.getElementById('uploadZone').style.display = 'block';
  document.getElementById('fileInput').value = '';
}

function compressImage(file, maxWidth, quality, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const base64 = canvas.toDataURL('image/jpeg', quality);
      const sizeKB = Math.round(base64.length * 0.75 / 1024);
      callback(base64, sizeKB);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function submitForm() {
  const name = document.getElementById('sel-name').value;
  const diary = document.getElementById('inp-diary').value.trim();
  const btn = document.getElementById('submit-btn');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');

  if (!name) { showMsg('請先選擇你的名字！', false); return; }
  if (!compressedBase64 && !diary) { showMsg('請至少上傳一張照片或寫下心得！', false); return; }

  btn.disabled = true;
  btn.textContent = '上傳中…';
  progressWrap.style.display = 'block';
  progressBar.style.width = '30%';

  try {
    const response = await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: name,
        day: selectedDay,
        photo: compressedBase64,
        diary: diary
      })
    });

    progressBar.style.width = '100%';
    setTimeout(() => {
      progressWrap.style.display = 'none';
      progressBar.style.width = '0%';
    }, 600);

    showMsg('🎉 送出成功！照片和心得已經儲存了！', true);
    changePhoto();
    document.getElementById('inp-diary').value = '';

  } catch(e) {
    showMsg('送出失敗，請檢查網路後再試', false);
    progressWrap.style.display = 'none';
  }

  btn.disabled = false;
  btn.textContent = '送出';
}

function showMsg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 5000);
}
</script>
</body>
</html>
