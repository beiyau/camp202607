<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生活大冒險｜學員上傳區</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F0EEE9;--bg2:#E4E0D8;--card:#D5D0C8;
  --nav:#3D3B37;--text:#3D3B37;--sub:#8A8880;--hint:#B0A9A0;
  --accent:#7A9470;--accent2:#5C7254;
  --warm:#B85C38;--gold:#C8B87A;
  --cream:#FAF8F4;
}
body{background:var(--bg);font-family:"Noto Sans TC",sans-serif;color:var(--text);min-height:100svh}
header{background:var(--nav);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.06)}
.header-center{text-align:center;flex:1}
header h1{font-family:"Zen Kaku Gothic New",sans-serif;font-size:1.2rem;color:var(--gold);font-weight:700;letter-spacing:.06em}
header p{color:rgba(255,255,255,.45);font-size:.75rem;margin-top:3px;letter-spacing:.04em}
.home-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.75);font-family:"Noto Sans TC",sans-serif;font-size:.78rem;font-weight:700;padding:7px 14px;border-radius:4px;text-decoration:none;white-space:nowrap;transition:background .2s}
.home-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.container{max-width:480px;margin:32px auto;padding:0 20px 60px}
.card{background:var(--cream);border-radius:8px;padding:24px 20px;border:1px solid var(--card);margin-bottom:14px}
label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.18em;color:var(--hint);text-transform:uppercase;margin-bottom:10px}
select,textarea{width:100%;padding:10px 13px;border:1.5px solid var(--card);border-radius:6px;font-family:"Noto Sans TC",sans-serif;font-size:.92rem;outline:none;transition:border .2s;background:#fff;color:var(--text)}
select:focus,textarea:focus{border-color:var(--accent)}
.day-pills{display:flex;gap:6px}
.day-pill{flex:1;padding:9px 0;border:1.5px solid var(--card);border-radius:4px;background:#fff;font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:.82rem;color:var(--hint);cursor:pointer;text-align:center;transition:all .2s}
.day-pill.active{border-color:var(--accent);color:var(--accent);background:var(--cream)}
textarea{min-height:110px;resize:vertical;line-height:1.7}
.submit-btn{width:100%;padding:14px;background:var(--nav);color:var(--gold);border:none;border-radius:6px;font-family:"Zen Kaku Gothic New",sans-serif;font-size:1rem;cursor:pointer;transition:opacity .2s;margin-top:4px;font-weight:700;letter-spacing:.06em}
.submit-btn:hover{opacity:.82}
.submit-btn:disabled{opacity:.4;cursor:not-allowed}
.msg{text-align:center;padding:12px;border-radius:6px;font-weight:700;margin-top:14px;display:none;font-size:.88rem}
.msg.ok{background:#e8f5e2;color:#3a6b2a;border:1px solid #c2e0b4}
.msg.err{background:#fae8e8;color:#7a2a2a;border:1px solid #e0b4b4}
.photo-hint{font-size:.75rem;color:var(--hint);margin-top:6px;line-height:1.6}
.step{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:.72rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>
<header>
  <a class="home-btn" href="index.html">← 返回首頁</a>
  <div class="header-center">
    <h1>🏕️ 生活大冒險 2026</h1>
    <p>學員上傳專區｜貼照片・寫心得</p>
  </div>
  <div style="width:90px"></div>
</header>
<div class="container">
  <div class="card">
    <label>我是誰？</label>
    <select id="sel-name">
      <option value="">— 選擇你的名字 —</option>
      <option value="小恩">🐯 小恩</option>
      <option value="莎莎">🐰 莎莎</option>
      <option value="一樂">🐻 一樂</option>
      <option value="候補">🦊 候補</option>
    </select>
  </div>
  <div class="card">
    <label>這是第幾天的內容？</label>
    <div class="day-pills">
      <button class="day-pill active" data-day="1" onclick="pickDay(this)">第一天</button>
      <button class="day-pill" data-day="2" onclick="pickDay(this)">第二天</button>
      <button class="day-pill" data-day="3" onclick="pickDay(this)">第三天</button>
    </div>
  </div>
  <div class="card">
    <label>📸 照片連結</label>
    <div class="step"><div class="step-num">1</div><span style="font-size:.83rem">打開 Google 相簿，點選照片</span></div>
    <div class="step"><div class="step-num">2</div><span style="font-size:.83rem">右上角點「⋮」→「複製連結」</span></div>
    <div class="step"><div class="step-num">3</div><span style="font-size:.83rem">貼到下面（可貼多張，用換行分隔）</span></div>
    <textarea id="inp-photo" placeholder="https://photos.google.com/...&#10;https://photos.google.com/..." style="min-height:80px;margin-top:10px"></textarea>
    <p class="photo-hint">💡 每行一個連結，可以一次貼好幾張</p>
  </div>
  <div class="card">
    <label>📝 今天的心得</label>
    <textarea id="inp-diary" placeholder="寫下今天學到什麼、最開心的事、最有挑戰的事…"></textarea>
  </div>
  <button class="submit-btn" id="submit-btn" onclick="submitForm()">送出</button>
  <div class="msg" id="msg"></div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLZcMRiGqPf0VjigZKPyTctxl6Gcx16i-FmZPzFaJDKbPyhGiuroklr_XzJvL2RxpR/exec";
let selectedDay = 1;
function pickDay(btn) {
  document.querySelectorAll('.day-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedDay = parseInt(btn.dataset.day);
}
async function submitForm() {
  const name = document.getElementById('sel-name').value;
  const photo = document.getElementById('inp-photo').value.trim();
  const diary = document.getElementById('inp-diary').value.trim();
  const btn = document.getElementById('submit-btn');
  if (!name) { showMsg('請先選擇你的名字！', false); return; }
  if (!photo && !diary) { showMsg('請至少填寫照片連結或心得其中一項！', false); return; }
  btn.disabled = true; btn.textContent = '送出中…';
  const photos = photo ? photo.split('\n').map(s=>s.trim()).filter(Boolean) : [''];
  try {
    for (const ph of photos) {
      await fetch(SCRIPT_URL, {method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,day:selectedDay,photo:ph,diary})});
    }
    showMsg('送出成功！照片和心得已經儲存了！', true);
    document.getElementById('inp-photo').value = '';
    document.getElementById('inp-diary').value = '';
  } catch(e) { showMsg('送出失敗，請檢查網路後再試一次', false); }
  btn.disabled = false; btn.textContent = '送出';
}
function showMsg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text; el.className = 'msg '+(ok?'ok':'err'); el.style.display = 'block';
  setTimeout(() => el.style.display='none', 4000);
}
</script>
</body>
</html>
