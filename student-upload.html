<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生活大冒險｜學員上傳區</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Lilita+One&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0D1B2A;--sun:#FFB830;--sky:#00C9A7;--coral:#FF6F61;--cream:#FFF8EE}
body{background:var(--cream);font-family:"Noto Sans TC",sans-serif;color:var(--navy);min-height:100svh}
header{background:var(--navy);padding:20px 24px;text-align:center}
header h1{font-family:"Lilita One",cursive;font-size:1.5rem;color:var(--sun)}
header p{color:rgba(255,255,255,.6);font-size:.82rem;margin-top:4px}
.container{max-width:500px;margin:32px auto;padding:0 20px 60px}
.card{background:#fff;border-radius:24px;padding:28px 24px;box-shadow:0 4px 20px rgba(0,0,0,.07);margin-bottom:20px}
label{display:block;font-size:.8rem;font-weight:700;letter-spacing:.1em;color:#aaa;text-transform:uppercase;margin-bottom:8px}
select,textarea,input[type=text]{
  width:100%;padding:12px 14px;border:2px solid #eee;border-radius:14px;
  font-family:"Noto Sans TC",sans-serif;font-size:.95rem;outline:none;
  transition:border .2s;background:#fafafa
}
select:focus,textarea:focus,input[type=text]:focus{border-color:var(--sky);background:#fff}
.day-pills{display:flex;gap:8px;margin-bottom:0}
.day-pill{flex:1;padding:10px 0;border:2px solid #eee;border-radius:12px;
  background:#fff;font-family:"Noto Sans TC",sans-serif;font-weight:700;
  font-size:.85rem;color:#bbb;cursor:pointer;text-align:center;transition:all .2s}
.day-pill.active{border-color:var(--coral);color:var(--coral);background:#fff5f4}
textarea{min-height:120px;resize:vertical;line-height:1.7}
.submit-btn{
  width:100%;padding:16px;background:var(--navy);color:var(--sun);
  border:none;border-radius:16px;font-family:"Lilita One",cursive;
  font-size:1.2rem;cursor:pointer;box-shadow:0 6px 0 rgba(13,27,42,.2);
  transition:transform .15s,box-shadow .15s;margin-top:4px
}
.submit-btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(13,27,42,.2)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.msg{text-align:center;padding:14px;border-radius:14px;font-weight:700;margin-top:16px;display:none}
.msg.ok{background:#d6ffe8;color:#0a6b3a}
.msg.err{background:#ffd6d6;color:#8b0000}
.photo-hint{font-size:.78rem;color:#bbb;margin-top:6px;line-height:1.5}
.step{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--sun);color:var(--navy);
  font-weight:900;font-size:.75rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>
<header>
  <h1>🏕️ 生活大冒險 2026</h1>
  <p>學員上傳專區｜貼照片・寫心得</p>
</header>
<div class="container">

  <div class="card">
    <label>我是誰？</label>
    <select id="sel-name">
      <option value="">— 選擇你的名字 —</option>
      <option value="小恩">🐯 小恩</option>
      <option value="莎莎">🐰 莎莎</option>
      <option value="候補A">🐻 候補A</option>
      <option value="候補B">🦊 候補B</option>
    </select>
  </div>

  <div class="card">
    <label>這是第幾天的內容？</label>
    <div class="day-pills">
      <button class="day-pill active" data-day="1" onclick="pickDay(this)">第一天</button>
      <button class="day-pill" data-day="2" onclick="pickDay(this)">第二天</button>
      <button class="day-pill" data-day="3" onclick="pickDay(this)">第三天</button>
    </div>
  </div>

  <div class="card">
    <label>📸 照片連結</label>
    <div class="step"><div class="step-num">1</div><span style="font-size:.85rem">打開 Google 相簿，點選照片</span></div>
    <div class="step"><div class="step-num">2</div><span style="font-size:.85rem">右上角點「⋮」→「複製連結」</span></div>
    <div class="step"><div class="step-num">3</div><span style="font-size:.85rem">貼到下面（可貼多張，用換行分隔）</span></div>
    <textarea id="inp-photo" placeholder="https://photos.google.com/...&#10;https://photos.google.com/...&#10;&#10;也可以貼其他圖片網址" style="min-height:90px;margin-top:12px"></textarea>
    <p class="photo-hint">💡 每行一個連結，可以一次貼好幾張</p>
  </div>

  <div class="card">
    <label>📝 今天的心得</label>
    <textarea id="inp-diary" placeholder="寫下今天學到什麼、最開心的事、最有挑戰的事…"></textarea>
  </div>

  <button class="submit-btn" id="submit-btn" onclick="submitForm()">送出 →</button>
  <div class="msg" id="msg"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyV5y6enIpg5uh5GP_x4HE0NPkjIYczrDkelhSlnXCJ2IamPpxZeFJ3B5tSLL2O_XzmNg/exec";
let selectedDay = 1;

function pickDay(btn) {
  document.querySelectorAll('.day-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedDay = parseInt(btn.dataset.day);
}

async function submitForm() {
  const name = document.getElementById('sel-name').value;
  const photo = document.getElementById('inp-photo').value.trim();
  const diary = document.getElementById('inp-diary').value.trim();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit-btn');

  if (!name) { showMsg('請先選擇你的名字！', false); return; }
  if (!photo && !diary) { showMsg('請至少填寫照片連結或心得其中一項！', false); return; }

  btn.disabled = true;
  btn.textContent = '送出中…';

  // 每行一張照片，分開送
  const photos = photo ? photo.split('\n').map(s=>s.trim()).filter(Boolean) : [''];
  const diary_val = diary || '';

  try {
    for (const ph of photos) {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name, day: selectedDay, photo: ph, diary: diary_val })
      });
    }
    showMsg('🎉 送出成功！照片和心得已經儲存了！', true);
    document.getElementById('inp-photo').value = '';
    document.getElementById('inp-diary').value = '';
  } catch(e) {
    showMsg('⚠️ 送出失敗，請檢查網路後再試一次', false);
  }

  btn.disabled = false;
  btn.textContent = '送出 →';
}

function showMsg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}
</script>
</body>
</html>
